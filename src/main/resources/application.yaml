spring:
  profiles:
    active: dev
  application:
    name: store
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/store_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    show-sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  thymeleaf:
    check-template-location: false


jwt:
  secret: ${JWT_TOKEN_SECRET}
  token-expiration: ${JWT_TOKEN_EXPIRATION:300}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800}


stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret-key: ${STRIPE_WEBHOOK_SECRET_KEY:${STRIPE_WEBHOOK_SCRET_KEY:}}

frontend-url: ${FRONTEND_URL:http://localhost:4242}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true